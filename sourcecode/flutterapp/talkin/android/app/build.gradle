plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

android {
    namespace = "com.notisboard.mobile"
    compileSdk = 36
    buildToolsVersion = "35.0.0"
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true

    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.notisboard.mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }

    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false  // ✅ This fixes 16 KB alignment
        }

        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
    lintOptions {
        checkReleaseBuilds false
        abortOnError false  // ✅ Add this to prevent lint errors from stopping builds
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}
dependencies {
    implementation 'com.google.android.material:material:1.10.0' // or later version
    implementation 'androidx.lifecycle:lifecycle-process:2.6.2' // or later version
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // Keep Compose artifacts on a single compatible line.
    // Stripe PaymentSheet uses Compose internally; mixed versions were crashing
    // with NoSuchMethodError in SemanticsPropertiesKt on some devices.
    constraints {
        implementation('androidx.compose.runtime:runtime:1.7.0')
        implementation('androidx.compose.runtime:runtime-android:1.7.0')
        implementation('androidx.compose.runtime:runtime-saveable:1.7.0')
        implementation('androidx.compose.runtime:runtime-saveable-android:1.7.0')
        implementation('androidx.compose.runtime:runtime-livedata:1.7.0')

        implementation('androidx.compose.ui:ui:1.7.0')
        implementation('androidx.compose.ui:ui-android:1.7.0')
        implementation('androidx.compose.ui:ui-text:1.7.0')
        implementation('androidx.compose.ui:ui-text-android:1.7.0')
        implementation('androidx.compose.ui:ui-graphics:1.7.0')
        implementation('androidx.compose.ui:ui-graphics-android:1.7.0')
        implementation('androidx.compose.ui:ui-unit:1.7.0')
        implementation('androidx.compose.ui:ui-unit-android:1.7.0')
        implementation('androidx.compose.ui:ui-geometry:1.7.0')
        implementation('androidx.compose.ui:ui-geometry-android:1.7.0')
        implementation('androidx.compose.ui:ui-util:1.7.0')
        implementation('androidx.compose.ui:ui-util-android:1.7.0')
        implementation('androidx.compose.ui:ui-tooling-preview:1.7.0')
        implementation('androidx.compose.ui:ui-tooling-preview-android:1.7.0')
        implementation('androidx.compose.ui:ui-viewbinding:1.7.0')

        implementation('androidx.compose.foundation:foundation:1.7.0')
        implementation('androidx.compose.foundation:foundation-android:1.7.0')
        implementation('androidx.compose.foundation:foundation-layout:1.7.0')
        implementation('androidx.compose.foundation:foundation-layout-android:1.7.0')

        implementation('androidx.compose.animation:animation:1.7.0')
        implementation('androidx.compose.animation:animation-android:1.7.0')
        implementation('androidx.compose.animation:animation-core:1.7.0')
        implementation('androidx.compose.animation:animation-core-android:1.7.0')

        implementation('androidx.compose.material:material:1.7.0')
        implementation('androidx.compose.material:material-android:1.7.0')
        implementation('androidx.compose.material:material-icons-core:1.7.0')
        implementation('androidx.compose.material:material-icons-core-android:1.7.0')
        implementation('androidx.compose.material:material-ripple:1.7.0')
        implementation('androidx.compose.material:material-ripple-android:1.7.0')
    }

}


