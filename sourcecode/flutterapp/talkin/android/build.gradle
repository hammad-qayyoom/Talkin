// android/build.gradle

    buildscript {
        ext.kotlin_version = '2.1.0' // ✅ Use the latest stable version

        repositories {
            google()
            mavenCentral()
        }

        dependencies {
            // Kotlin Gradle plugin updated to match the latest version
            classpath 'com.android.tools.build:gradle:8.9.1'
            classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"  // Kotlin plugin
            classpath 'com.google.gms:google-services:4.3.14'  // Update Google services plugin if necessary
        }
    }

    allprojects {
        repositories {
            google()
            mavenCentral()
            // Fix for plugins still using jcenter
            all { ArtifactRepository repo ->
                if (repo.url.toString().contains("jcenter.bintray.com")) {
                    remove(repo)
                }
            }
        }
    }

    rootProject.buildDir = "../build"
    subprojects {
        project.buildDir = "${rootProject.buildDir}/${project.name}"
        afterEvaluate { project ->
            if (project.hasProperty('android')) {
                project.android {
                    if (namespace == null) {
                        namespace project.group
                    }
                }
            }
        }
    }

    subprojects {
        project.evaluationDependsOn(":app")
    }

    tasks.register("clean", Delete) {
        delete rootProject.buildDir
    }
