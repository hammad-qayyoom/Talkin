<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Redirecting…</title>

<!-- Instant redirect (no delay) -->
<meta http-equiv="refresh" content="0;url=https://help.incodeslab.com/" />

<link rel="canonical" href="https://help.incodeslab.com/" />

<script>
// Immediate redirect (best for most browsers)
window.location.replace("https://help.incodeslab.com/");
</script>

<noscript>
<!-- If JS is disabled, meta refresh still redirects instantly -->
</noscript>
</head>
<body>
<!-- Fallback link in case redirects are blocked -->
<p>If you are not redirected automatically, <a href="https://help.incodeslab.com/">click here</a>.</p>
</body>
</html>
